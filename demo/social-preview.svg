<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <rect width="1280" height="640" fill="#0d1117"/>
  <text x="80" y="150" font-family="Menlo, monospace" font-size="84" font-weight="bold" fill="#f0f6fc">mcp-leash</text>
  <text x="80" y="215" font-family="Helvetica Neue, Helvetica, sans-serif" font-size="34" fill="#9da7b3">Find the dangerous tools in your MCP servers</text>
  <text x="80" y="260" font-family="Helvetica Neue, Helvetica, sans-serif" font-size="34" fill="#9da7b3">and lock them down in Claude Code. One command.</text>
  <rect x="80" y="310" width="1120" height="250" rx="14" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="115" y="365" font-family="Menlo, monospace" font-size="28" fill="#7ee787">$ npx mcp-leash</text>
  <text x="115" y="420" font-family="Menlo, monospace" font-size="26"><tspan fill="#ff7b72" font-weight="bold">CRITICAL</tspan><tspan fill="#c9d1d9">  delete_repository        → deny</tspan></text>
  <text x="115" y="465" font-family="Menlo, monospace" font-size="26"><tspan fill="#e3b341" font-weight="bold">WRITE   </tspan><tspan fill="#c9d1d9">  push_files               → ask</tspan></text>
  <text x="115" y="510" font-family="Menlo, monospace" font-size="26"><tspan fill="#79c0ff" font-weight="bold">READ    </tspan><tspan fill="#c9d1d9">  get_issue                → allowed</tspan></text>
</svg>
