name: Feature request
description: Suggest a preset, rule type or command
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to protect against or make easier?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should mcp-leash do? For a new preset, list the server and its tools.
    validations:
      required: false
